.test:base:
  stage: test
  rules:
    - changes:
        - buildset/*
        - modules/*
        - modules/**/*
        - pom.xml
    - if: $CI_COMMIT_TAG
  needs:
    - build
  retry:
    when: script_failure
    max: 1
  variables:
    TEST_DATABASE_URL: "NOT SET"
  script:
    - mvn install -ntp -s $MAVEN_SETTINGS
  artifacts:
    # We want test report when job fails
    when: always
    paths:
      - "**/target/surefire-reports/"
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"

test:hsqldb:
  extends: .test:base
  variables:
    TEST_DATABASE_URL: "jdbc:hsqldb:mem:admin"

test:postgresql:
  extends: .test:base
  variables:
    TEST_DATABASE_URL: "jdbc:postgresql://postgres:5432/admin"
    POSTGRES_DB: admin
    POSTGRES_USER: exa_user
    POSTGRES_PASSWORD: exa_password
    DATABASE_USERNAME: exa_user
    DATABASE_PASSWORD: exa_password
  services:
    - name: postgres:13.4-alpine3.14

check-helm-templates:
  image: "alpine/k8s:$FUTURAPOLIS_KUBE_CLUSTER_VERSION"
  stage: test
  rules:
    - changes:
      - helm/*
      - helm/**/*
  script:
    - helm dependency update helm/examind-community
    - |
      for valueFile in $(find helm/examples -type f -name '*.yaml' -not \( -path 'helm/examples/do-not-do-that/*' -o -path 'helm/examples/access-self-signed-certs/*' \) )
      do
        printf '\n-------\nVALUES: %s\n-------\n' "$valueFile"
        helm template -n test --values "$valueFile" test helm/examind-community || exit 1
      done
