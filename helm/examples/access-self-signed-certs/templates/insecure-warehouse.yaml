apiVersion: v1
kind: ConfigMap
metadata:
  name: insecure-warehouse-conf
data:
  nginx.conf: |
    server {
      listen       9443 ssl;
      server_name  insecure-warehouse;
      ssl_certificate     /tmp/cert/self-signed.crt;
      ssl_certificate_key /tmp/cert/self-signed.key;

      root /usr/share/nginx/html/www/;

      location / {
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insecure-warehouse-data
data:
  geojson-sample.json: |
    {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "title": "Auberge de Valestalière"
          },
          "geometry": {
            "coordinates": [
              3.8503851993522638,
              44.01664217127339
            ],
            "type": "Point"
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-warehouse
  labels:
    app: insecure-warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-warehouse
  template:
    metadata:
      name: insecure-warehouse
      labels:
        app: insecure-warehouse
    spec:
      containers:
        - name: insecure-warehouse
          image: quay.io/nginx/nginx-unprivileged:1.29.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: cert
              mountPath: /tmp/cert
            - name: conf
              mountPath: /etc/nginx/conf.d/
            - name: data
              mountPath: /usr/share/nginx/html/www/
      restartPolicy: Always
      volumes:
        - name: cert
          secret:
            secretName: self-signed-cert
        - name: conf
          configMap:
            name: insecure-warehouse-conf
        - name: data
          configMap:
            name: insecure-warehouse-data
---
apiVersion: v1
kind: Service
metadata:
  name: insecure-warehouse
spec:
  selector:
    app: insecure-warehouse
  ports:
    - protocol: TCP
      port: 9443
      targetPort: 9443
  type: NodePort
