<!DOCTYPE html>
<html>

<head>
    <title>OGC-API DGGS service</title>
    <meta charset="UTF-8">
    <base href="_baseurl_" />
    <link rel="icon" type="image/png" href="./img/favicon.ico" />
    <link href="https://viglino.github.io/font-gis/css/font-gis.css" rel="stylesheet" />
    <style>
        html { height: 100%; width: 100%; margin: 0; }
        body {
          height: 100%;
          width: 100%;
          margin: 0;
          font-family: Verdana,Arial,Helvetica,sans-serif;
          color: #EEE;
          font-size: 14px;
          background-image : url("./img/pattern.jpg");
          background-color : #555;
          line-height: 1.5;
          }
        a {
          color: #CCC;
          text-decoration: none;
          background-color : rgba(255,255,255,.05);
          padding : 3px;
          margin : 4px;
          border-bottom: 1px solid rgba(255,255,255,.5);
          }
        a:hover {
          color: #FFF;
          text-decoration: none;
          background-color : rgba(0,0,0,.2);
          border-bottom : 1px solid rgba(255,255,255,.5);
          }
        td {
          vertical-align: middle;
          white-space: nowrap;
        }
        tr {
          border-color: #777;
          td:last-of-type {
            width: 100%;
          }
        }
        tr.zone:hover {
          cursor: pointer;
          background: #FFFFFF44;
        }
        .container { display: flex; flex-direction: column; height: 100%; }
        .body {
          flex: 1 1 auto;
          display: block;
          overflow: auto;
          padding: 40px;
          }
        .group-header {
          color: #BBB;
          background-color: #2c2c2c;
          font-size: 20px;
          font-weight: bold;
          padding: 10px;
          border-radius: 10px 10px 0px 0px;
          }
        .group-body {
          background-color: rgba(150,150,150,.3);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 20px;
          }
        .subgroup-header {
          color: #BBB;
          background-color: rgba(0,0,0,0.2);
          font-size: 15px;
          font-weight: bold;
          padding: 8px;
          border-radius: 10px 10px 0px 0px;
          }
        .subgroup-body {
          background-color: rgba(0,0,0,0.1);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 10px;
          }
        .subgroup-body2 {
          background-color: rgba(0,0,0,0.1);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 0px;
          }
        #alternates {
          color: #BBB;
          background-color: #359cbb6b;
          font-size: 16px;
          padding: 10px;
          border-radius: 20px;
          margin: 0px 0px 10px 0px;
          }
        #header {background-image: linear-gradient(to bottom,#6f6f6f 0,#303030 46px);padding:6px 0px 4px 19px}
        #footer {
          background-color: #333;
          text-align: end;
          padding:6px 19px 4px 19px
          }

        #datatable tr:nth-child(odd) td{
          padding : 7px;
          background-color: rgba(0,0,0,0.15);
        }
        #datatable tr:nth-child(even) td{
          padding : 7px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="header">
            <img src="./img/constellation-menu.svg" style="height:34px;">
        </div>
        <div class="body">
          <div id="alternates"></div>

          <div class="group-header">Zones</div>
          <div class="group-body">

            <div style="width: 100%;overflow:auto;">
              <div style="float:left; width: 50%">
              <div id="content1"></div>
              </div>
              <div style="float:right; width: 50%">
              <div id="links" style="width: fit-content"></div>
              </div>
            </div>

            <div class="subgroup-header">Root zones</div>
            <div id="rootZones" class="subgroup-body2"></div>
          </div>


        </div>
        <div id="footer">
            <a class="logo-geomatys-a" href="http://www.geomatys.com" target="_blank">
             <img class="logo-geomatys" src="./img/logo-geomatys-footer.svg" alt="Geomatys" style="height:34px;">
            </a>
        </div>
    </div>

    <script>
        // utils scripts
        const json = JSON.parse(_json_);

        function linksBlock(title, links) {
          var all = document.createElement('div');
          var head = document.createElement('div');
          head.className = "subgroup-header";
          var span = document.createElement('span');
          span.className = "fg-poi";
          var title = document.createTextNode(title);
          var content = document.createElement('div');
          content.className = "subgroup-body";
          content.appendChild(linksTable(links));
          head.appendChild(span);
          head.appendChild(title);
          all.appendChild(head);
          all.appendChild(content);
          return all;
        }

        function linksTable(links) {
          var table = document.createElement('table');
            for (const link of links) {
              var tr = document.createElement('tr');
              var td = document.createElement('td');
              var a = document.createElement('a');
              let target = URL.parse(link.href, window.location.href);
              a.href = target;
              a.textContent = link.title;
              td.appendChild(a);
              tr.appendChild(td);
              table.appendChild(tr);
            }
          return table;
        }

        function removeAlternates(links) {
            var alternates = [];
            for (var i = links.length-1; i >= 0; i--) {
                var link = links[i];
                if (link.rel != null && link.rel == "alternate") {
                    alternates = links.splice(i,1).concat(alternates);
                }
            }
            return alternates;
        }

        function alternatesBlock(links) {
            var alternates = removeAlternates(links);
            if (alternates.length === 0) {
                return "";
            } else {
                var text = "View in : ";
                for (const link of alternates) {
                    let target = URL.parse(link.href, window.location.href);
                    text += ` <a href="${target}">${link.title}</a> `;
                }
                return text;
            }
        }

    </script>

    <script>
        document.getElementById("alternates").innerHTML = alternatesBlock(json.links);


        var table = document.createElement('table');
        table.id = "datatable";
        table.border = 1;
        table.frame = 'void';
        table.rules = 'rows';
        { //header
        var tr = document.createElement('tr');
        tr.innerHTML = "<td>Zone ID</td><td>Preview</td>";
        table.appendChild(tr);
        }
        for (const zone of json.zones) {
            var tr = document.createElement('tr');
            var td1 = document.createElement('td');
            let tdprev = document.createElement('td');
            var title = document.createTextNode(zone);

              let target = URL.parse("./zones/"+zone, window.location.href);
              tr.className = 'zone';
              tr.onclick = function() { window.open(target,"_self") };

              let imgsrc = target + "/data?zone-depth=" +json._linkZoneDepth+ "&crs=COMPUTED:ORTHOGRAPHIC&f=png";
              tdprev.innerHTML = `<img style="height:64px;image-rendering: pixelated;filter:drop-shadow(2px 2px 4px black)" src="${imgsrc}"/>`;

            td1.appendChild(title);
            tr.appendChild(td1);
            tr.appendChild(tdprev);
            table.appendChild(tr);
        }


        var text = "";
        if (json.returnedAreaMetersSquare != null) text += `<b>Total area (m\u00b2) : </b> ${json.returnedAreaMetersSquare} <br>`;
        if (json.returnedVolumeMetersCube != null) text += `<b>Total volume (m\u00b3) : </b> ${json.returnedVolumeMetersCube} <br>`;
        if (json.returnedVolumeMetersSquareSeconds != null) text += `<b>Total volume (m\u00b2/s)	: </b> ${json.returnedVolumeMetersSquareSeconds} <br>`;
        if (json.returnedHyperVolumeMetersCubeSeconds != null) text += `<b>Total hyper-volume (m\u00b3/s)	: </b> ${json.returnedHyperVolumeMetersCubeSeconds} <br>`;
        text += `<br><br>`;

        document.getElementById("content1").innerHTML = text;
        document.getElementById("rootZones").appendChild(table);
        document.getElementById("links").appendChild(linksBlock("Links", json.links));

    </script>
</body>

</html>
