<!DOCTYPE html>
<html>

<head>
    <title>OGC-API DGGS service</title>
    <meta charset="UTF-8">
    <base href="_baseurl_" />
    <link rel="icon" type="image/png" href="./img/favicon.ico" />
    <link href="https://viglino.github.io/font-gis/css/font-gis.css" rel="stylesheet" />
    <style>
        html { height: 100%; width: 100%; margin: 0; }
        body {
          height: 100%;
          width: 100%;
          margin: 0;
          font-family: Verdana,Arial,Helvetica,sans-serif;
          color: #EEE;
          font-size: 14px;
          background-image : url("./img/pattern.jpg");
          background-color : #555;
          line-height: 1.5;
          }
        a {
          color: #CCC;
          text-decoration: none;
          background-color : rgba(255,255,255,.05);
          padding : 3px;
          margin : 4px;
          border-bottom: 1px solid rgba(255,255,255,.5);
          }
        a:hover {
          color: #FFF;
          text-decoration: none;
          background-color : rgba(0,0,0,.2);
          border-bottom : 1px solid rgba(255,255,255,.5);
          }
        td {
          vertical-align: middle;
          white-space: nowrap;
        }
        tr {
          border-color: #777;
        }
        tr.zone:hover {
          cursor: pointer;
          background: #FFFFFF44;
        }
        .container { display: flex; flex-direction: column; height: 100%; }
        .body {
          flex: 1 1 auto;
          display: block;
          overflow: auto;
          padding: 40px;
          }
        .group-header {
          color: #BBB;
          background-color: #2c2c2c;
          font-size: 20px;
          font-weight: bold;
          padding: 10px;
          border-radius: 10px 10px 0px 0px;
          }
        .group-body {
          background-color: rgba(150,150,150,.3);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 20px;
          }
        .subgroup-header {
          color: #BBB;
          background-color: rgba(0,0,0,0.4);
          font-size: 15px;
          font-weight: bold;
          padding: 8px;
          border-radius: 10px 10px 0px 0px;
          }
        .subgroup-body {
          background-color: rgba(0,0,0,0.1);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 10px;
          }
        .subgroup-body2 {
          background-color: rgba(0,0,0,0.1);
          margin: 0px 0px 8px 0px;
          border-radius: 0px 0px 4px 4px;
          padding: 0px;
          }
        .tablecolheader {
        }
        #alternates {
          color: #BBB;
          background-color: #359cbb6b;
          font-size: 16px;
          padding: 10px;
          border-radius: 20px;
          margin: 0px 0px 10px 0px;
          }
        #header {background-image: linear-gradient(to bottom,#6f6f6f 0,#303030 46px);padding:6px 0px 4px 19px}
        #footer {
          background-color: #333;
          text-align: end;
          padding:6px 19px 4px 19px
          }

        #datatable {
          white-space:nowrap;
        }
        #datatable tr:nth-child(odd) td{
          padding : 7px;
          background-color: rgba(0,0,0,0.1);
        }
        #datatable tr:nth-child(even) td{
          padding : 7px;
        }
        #datatable tr:nth-child(1){
          font-size:smaller;
        }
        #datatable tr td:last-of-type {
          width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="header">
            <img src="./img/constellation-menu.svg" style="height:34px;">
        </div>
        <div class="body">

          <div id="alternates"></div>

          <div id="title" class="group-header">Zone</div>
          <div class="group-body">

           <table style="width:100%">
            <tr>
              <td style="width:260px">
              <img id="preview" style="height:256px;width:256px;margin:10px;image-rendering: pixelated;filter:drop-shadow(5px 5px 8px black)"/>
              </td>

              <td>
                <div id="content"></div>
                <div style="width:fit-content">
                  <div class="subgroup-header"><span class="fg-profile-o"></span> Statistics</div>
                  <div id="stats" style="width: fit-content"></div>
                </div>
              </td>

              <td>
                <div id="links" style="width: 100%"></div>
                <div id="downloads" style="width: 100%">
                  <div class="subgroup-header"><span class="fg-layer-download"></span> Download</div>
                  <div class="subgroup-body">
                      <a id="dl_dggsjson" >DGGS-JSON</a><br>
                      <a id="dl_dggsjsonfg" >DGGS-JSON-FG</a><br>
                      <a id="dl_geojson" >Geojson</a><br>
                      <a id="dl_geotiff" >GeoTiff</a><br>
                      <a id="dl_png" >Png</a><br>
                  </div>
                </div>
              </td>
            </tr>
          </table>

            <div style="width: 100%;overflow:auto;">
              <div style="float:left; width: 50%">
              </div>

              <div style="float:center; width:50%">

              </div>

              <div style="float:right; width: 50%">
              </div>
            </div>
            <br/>

            <div id="parents">
              <div class="subgroup-header">Parents</div>
              <div id="parents_tab" class="subgroup-body2"></div>
            </div>
            <br/>

            <div id="neighbors">
              <div class="subgroup-header">Neighbors</div>
              <div id="neighbors_tab" class="subgroup-body2"></div>
            </div>
            <br/>

            <div id="children">
              <div class="subgroup-header">Children</div>
              <div id="children_tab" class="subgroup-body2"></div>
            </div>

          </div>

        </div>
        <div id="footer">
            <a class="logo-geomatys-a" href="http://www.geomatys.com" target="_blank">
             <img class="logo-geomatys" src="./img/logo-geomatys-footer.svg" alt="Geomatys" style="height:34px;">
            </a>
        </div>
    </div>

    <script>
        // utils scripts
        const json = JSON.parse(_json_);

        function linksBlock(title, links) {
          var all = document.createElement('div');
          var head = document.createElement('div');
          head.className = "subgroup-header";
          var span = document.createElement('span');
          span.className = "fg-poi";
          var title = document.createTextNode(title);
          var content = document.createElement('div');
          content.className = "subgroup-body";
          content.appendChild(linksTable(links));
          head.appendChild(span);
          head.appendChild(title);
          all.appendChild(head);
          all.appendChild(content);
          return all;
        }

        function linksTable(links) {
          var table = document.createElement('table');
            for (const link of links) {
              var tr = document.createElement('tr');
              var td = document.createElement('td');
              var a = document.createElement('a');
              let target = URL.parse(link.href, window.location.href);
              a.href = target;
              a.textContent = link.title;
              td.appendChild(a);
              tr.appendChild(td);
              table.appendChild(tr);
            }
          return table;
        }

        function getLinksByRel(links, relName) {
            var alternates = [];
            for (var i = links.length-1; i >= 0; i--) {
                var link = links[i];
                if (link.rel != null && link.rel == relName) {
                    alternates.push(link);
                }
            }
            return alternates;
        }

        function removeLinksByRel(links, relName) {
            var alternates = [];
            for (var i = links.length-1; i >= 0; i--) {
                var link = links[i];
                if (link.rel != null && link.rel == relName) {
                    alternates = links.splice(i,1).concat(alternates);
                }
            }
            return alternates;
        }

        function relLinksBlock(links, relName) {
            var alternates = removeLinksByRel(links, relName);
            if (alternates.length === 0) {
                return "";
            } else {
                var text = "View in : ";
                for (const link of alternates) {
                    let target = URL.parse(link.href, window.location.href);
                    text += ` <a href="${target}">${link.title}</a> `;
                }
                return text;
            }
        }

        function zoneTable(links, relsublevel) {
          var table = document.createElement('table');
          table.id = "datatable";
          table.border = 1;
          table.frame = 'void';
          table.rules = 'rows';
          { //header
            var tr = document.createElement('tr');
            tr.innerHTML = "<td>Zone ID</td><td>Preview</td><td>Centroid(lon)</td><td>Centroid(lat)</td><td>Bbox(west)</td><td>Bbox(south)</td><td>Bbox(east)</td><td>Bbox(north)</td>";
            table.appendChild(tr);
          }
          for (const zone of links) {
              var tr = document.createElement('tr');
              let td1 = document.createElement('td');
              let tdprev = document.createElement('td');
              let tdlon = document.createElement('td');
              let tdlat = document.createElement('td');
              let tdwest = document.createElement('td');
              let tdeast = document.createElement('td');
              let tdnorth = document.createElement('td');
              let tdsouth = document.createElement('td');
              var title = document.createElement('div');
              let target = URL.parse(zone.href, window.location.href);
              title.innerHTML = zone.title;

              tr.className = 'zone';
              tr.onclick = function() { window.open(target,"_self") };

              let imgsrc = target +`/data?zone-depth=${relsublevel}&crs=COMPUTED:ORTHOGRAPHIC&f=png`;
              tdprev.innerHTML = `<img style="height:64px;image-rendering: pixelated;filter:drop-shadow(2px 2px 4px black)" src="${imgsrc}"/>`;
              let promise = getData(target);
              promise.then(function (result) {
                tdlon.innerHTML = result.centroid[0].toFixed(7);
                tdlat.innerHTML = result.centroid[1].toFixed(7);
                tdwest.innerHTML = result.bbox[0].toFixed(7);
                tdsouth.innerHTML = result.bbox[1].toFixed(7);
                tdeast.innerHTML = result.bbox[2].toFixed(7);
                tdnorth.innerHTML = result.bbox[3].toFixed(7);
              });

              td1.appendChild(title);
              tr.appendChild(td1);
              tr.appendChild(tdprev);
              tr.appendChild(tdlon);
              tr.appendChild(tdlat);
              tr.appendChild(tdwest);
              tr.appendChild(tdeast);
              tr.appendChild(tdnorth);
              tr.appendChild(tdsouth);
              table.appendChild(tr);
          }
          return table;
        }

        function statTable(stats) {
          var table = document.createElement('table');
          table.id = "datatable";
          table.border = 1;
          table.frame = 'void';
          table.rules = 'rows';
          { //header
            var tr = document.createElement('tr');
            tr.innerHTML = "<td>Band</td><td>Min</td><td>Max</td><td>Span</td><td>Average</td><td>STD</td><td>RMS</td><td>Count</td><td>Count NaN</td>";
            table.appendChild(tr);
          }
          Object.keys(stats).forEach(function(key,index) {
              var tr = document.createElement('tr');
              let tdband = document.createElement('td');
              let tdmin = document.createElement('td');
              let tdmax = document.createElement('td');
              let tdspan = document.createElement('td');
              let tdaverage = document.createElement('td');
              let tdstd = document.createElement('td');
              let tdrms = document.createElement('td');
              let tdcount = document.createElement('td');
              let tdcountnan = document.createElement('td');
              tdband.innerHTML = `${key}`;
              tdmin.innerHTML = `${toFixed(stats[key].minimum,3)}`;
              tdmax.innerHTML = `${toFixed(stats[key].maximum,3)}`;
              tdspan.innerHTML = `${toFixed(stats[key].span,3)}`;
              tdaverage.innerHTML = `${toFixed(stats[key].average,3)}`;
              tdstd.innerHTML = `${toFixed(stats[key].stdDev,3)}`;
              tdrms.innerHTML = `${toFixed(stats[key].rms,3)}`;
              tdcount.innerHTML = `${stats[key].count}`;
              tdcountnan.innerHTML = `${stats[key].countNaN}`;

              tr.appendChild(tdband);
              tr.appendChild(tdmin);
              tr.appendChild(tdmax);
              tr.appendChild(tdspan);
              tr.appendChild(tdaverage);
              tr.appendChild(tdstd);
              tr.appendChild(tdrms);
              tr.appendChild(tdcount);
              tr.appendChild(tdcountnan);
              table.appendChild(tr);
          });

          return table;
        }

        function toFixed(value, size) {
          if (value == undefined) return "";
          return value.toFixed(size);
        }

        async function getData(url) {
          try {
            url = url.toString();
            url = url.replace(new RegExp("\/collections\/[^/]*\/"),"/"); //do not get statistics
            const response = await fetch(url, {
                method: "GET",
                headers: {
                  "Accept": "application/json"
                }});
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }

            return await response.json();
          } catch (error) {
            console.error(error.message);
          }
        }


    </script>

    <script>
        document.getElementById("alternates").innerHTML = relLinksBlock(json.links, "alternate");

        let parentLinks = removeLinksByRel(json.links,"https://www.opengis.net/def/rel/ogc/1.0/dggrs-zone-parent");
        let neighborsLinks = removeLinksByRel(json.links,"https://www.opengis.net/def/rel/ogc/1.0/dggrs-zone-neighbor");
        let childrenLinks = removeLinksByRel(json.links,"https://www.opengis.net/def/rel/ogc/1.0/dggrs-zone-child");
        if (parentLinks.length === 0) document.getElementById("parents").style.display = "none";
        if (neighborsLinks.length === 0) document.getElementById("neighbors").style.display = "none";
        if (childrenLinks.length === 0) document.getElementById("children").style.display = "none";

        document.getElementById("title").innerHTML = "Zone " + json.id;

        var text = `<table>`
                + `<tr><td><b>Id</b></td><td>${json.id} </td></tr>`
                + `<tr><td><b>Shape</td><td>${json.shapeType} <br></td></tr>`
                + `<tr><td><b>Level</b></td><td>${json.level} <br></td></tr>`
                + `<tr><td><b>CRS</b></td><td>${json.crs} <br></td></tr>`
                + `<tr><td><b>Centroid</b></td><td>${json.centroid} <br></td></tr>`
                + `<tr><td><b>BBox</b></td><td>${json.bbox} <br></td></tr>`
                + `<tr><td><b>Geometry</b></td><td>${json.geometry} <br></td></tr>`
        if (json.areaMetersSquare != undefined) text += `<tr><td><b>Area (m\u00b2)</b></td><td>${json.areaMetersSquare} <br></td></tr>`;
        if (json.volumeMetersCube != undefined) text += `<tr><td><b>Volume (m\u00b3)</b></td><td>${json.volumeMetersCube} <br></td></tr>`;
        if (json.temporalDurationSeconds != undefined) text += `<tr><td><b>Temporal duration (s)</b></td><td>${json.temporalDurationSeconds} <br></td></tr>`;
        if (json.temporalInterval != undefined) text += `<tr><td><b>Temporal interval</b></td><td>${json.temporalInterval} <br></td></tr>`;
        text += `</table>`;
        text += `<br>`;

        document.getElementById("content").innerHTML = text;
        document.getElementById("stats").appendChild(statTable(json.statistics));
        document.getElementById("links").appendChild(linksBlock("Links", json.links));

        let dggrsDesc = getLinksByRel(json.links, "https://www.opengis.net/def/rel/ogc/1.0/dggrs")[0];
        let promise = getData(dggrsDesc.href);
        promise.then(function (result) {

            //ensure we don't go under the max level
            let maxLevel = result.maxRefinementLevel;
            console.log(json._previewZoneDepth);
            console.log(json._linkZoneDepth);


            let dlsublevel = json.level + json._previewZoneDepth;
            if (dlsublevel > maxLevel) dlsublevel = maxLevel;
            dlsublevel -= json.level;

            let chsublevel = json.level + json._linkZoneDepth;
            if (chsublevel > maxLevel -1) chsublevel = maxLevel -1;
            chsublevel -= json.level;

            let nghsublevel = chsublevel;
            if (nghsublevel < 3) nghsublevel++;

            let ptsublevel = nghsublevel;
            if (ptsublevel < 3) ptsublevel++;

            document.getElementById("parents_tab").appendChild(zoneTable(parentLinks, ptsublevel));
            document.getElementById("neighbors_tab").appendChild(zoneTable(neighborsLinks, nghsublevel));
            document.getElementById("children_tab").appendChild(zoneTable(childrenLinks, chsublevel));

            document.getElementById("preview").src = window.location.href + `/data?zone-depth=${dlsublevel}&crs=COMPUTED:ORTHOGRAPHIC&f=png`;
            document.getElementById("dl_dggsjson").href = window.location.href + `/data?zone-depth=${dlsublevel}&crs=CRS:84&f=json`;
            document.getElementById("dl_dggsjsonfg").href = window.location.href + `/data?zone-depth=${dlsublevel}&crs=CRS:84&f=jsonfg`;
            document.getElementById("dl_geojson").href = window.location.href + `/data?zone-depth=${dlsublevel}&crs=CRS:84&f=geojson`;
            document.getElementById("dl_geotiff").href = window.location.href + `/data?zone-depth=${dlsublevel}&crs=CRS:84&f=geotiff`;
            document.getElementById("dl_png").href = window.location.href + `/data?zone-depth=${dlsublevel}&crs=CRS:84&f=png`;
        });

    </script>
</body>

</html>
